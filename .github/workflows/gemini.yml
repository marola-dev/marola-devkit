name: gemini

on:
  pull_request_target:
    types: [review_requested]

permissions:
  contents: read

jobs:
  gemini:
    if: github.event.requested_team.slug == 'gemini'
    uses: ./.github/workflows/gemini-review.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PR_BOT_KEY: ${{ secrets.PR_BOT_KEY }}
    with:
      # The base commit under pull_request_target: a fork's head is never what runs.
      devkit-ref: ${{ github.sha }}
      check-command: bash tests/self-tests.sh
