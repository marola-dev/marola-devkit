name: skills

# Weekly: re-vendor the plugin's skills, 14 days behind upstream HEAD, as one PR (MIP-0080). The
# devkit calls its own reusable workflow at the pushed commit, as pr.yml does.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: ./.github/workflows/skills-update.yml
    with:
      devkit-ref: ${{ github.sha }}
      lock: plugins/marola-devkit/skills/skills.lock
