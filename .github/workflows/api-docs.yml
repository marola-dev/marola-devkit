# api-docs — reusable workflow (MIP-0074 §5.2; full docs: docs/4-reference_workflows.md#api-docs).
# Runs the caller's `just api-docs <out>` generator as a PR check; on a push, force-pushes the
# output as one orphan commit to `api-docs` via api-docs-push, so only the latest output is kept.
#
# Two jobs so that only `publish` sits in the `api-docs` concurrency group: a PR run can never
# cancel an in-flight publish. Each job's `if:` trusts the caller's own `on:` triggers rather than
# re-deriving "is this the default branch", as notify-umbrella.yml does.
name: api-docs

on:
  workflow_call:
    inputs:
      devkit-ref:
        description: "git ref of marola-devkit, whose scripts/api-docs-push.sh does the push."
        type: string
        required: true
      devkit-repo:
        description: "owner/repo of marola-devkit."
        type: string
        default: marola-dev/marola-devkit
      output-dir:
        description: "Where `just api-docs <output-dir>` writes the generated docs."
        type: string
        default: .tmp/api-docs

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # persist-credentials: false — this job runs a PR's own `just api-docs` recipe, so no token
      # (even a read-only one) is left in the checkout for it to find.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: just api-docs ${{ inputs.output-dir }}
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: nix develop --command just api-docs "$OUTPUT_DIR"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: api-docs
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: just api-docs ${{ inputs.output-dir }}
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: nix develop --command just api-docs "$OUTPUT_DIR"

      # Public repo — the default GITHUB_TOKEN can read it, no token input needed here.
      - name: checkout marola-devkit@${{ inputs.devkit-ref }} (scripts/api-docs-push.sh)
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.devkit-repo }}
          ref: ${{ inputs.devkit-ref }}
          path: .devkit-checkout

      - name: push the output as one orphan commit to api-docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTPUT_DIR: ${{ inputs.output-dir }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .devkit-checkout/scripts/api-docs-push.sh \
            "$OUTPUT_DIR" "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$SHA"
