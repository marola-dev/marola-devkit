name: context-probe

on:
  workflow_call:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: what a called workflow sees
        env:
          WF_REF: ${{ github.workflow_ref }}
          WF_SHA: ${{ github.workflow_sha }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: printf 'workflow_ref=%s\nworkflow_sha=%s\nrepository=%s\nsha=%s\n' "$WF_REF" "$WF_SHA" "$REPO" "$SHA"
