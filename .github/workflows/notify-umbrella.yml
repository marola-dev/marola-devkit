# notify-umbrella — tell the umbrella every push to main (`submodule-updated`), so
# pointer-sync.yml can move pointers on event instead of its daily cron, and that a repo's docs
# changed too (`submodule-docs-updated`) when the push touches README.md or docs/**, so
# docs.yml rebuilds within minutes (MIP-0070 §5.5, MIP-0076 §5.5 step 1). Modelled on
# h0ffmann/nix-config's profile-ping.yml reusable workflow — a plain repository_dispatch, no
# checkout needed on either side: the docs check reads the compare API instead of git.
#
# A consumer adds about three lines, no `paths:` filter — this workflow decides for itself which
# event types a given push earns:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     notify:
#       uses: marola-dev/marola-devkit/.github/workflows/notify-umbrella.yml@v0.8.1
#       secrets:
#         token: ${{ secrets.MAROLA_CROSS_REPO_PAT }}
#
# MAROLA_CROSS_REPO_PAT: the org's fine-grained PAT with Contents: read & write on the umbrella —
# repository_dispatch needs it; GITHUB_TOKEN cannot reach another repository. Unset is a notice,
# never a failure: the umbrella's own daily cron still picks the change up.
name: notify-umbrella

on:
  workflow_call:
    inputs:
      umbrella:
        description: "owner/repo to dispatch to (MAROLA_UMBRELLA, MIP-0070 §5.6)."
        type: string
        default: marola-dev/marola
      runner:
        description: "Runner label for the dispatch job — a reusable workflow's runs-on resolves in the caller's repository."
        type: string
        default: ubuntu-latest
    secrets:
      token:
        description: "Fine-grained PAT with Contents: read & write on the umbrella."
        required: false

permissions: {}

jobs:
  dispatch:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2
    steps:
      # A reusable workflow can only keep or lower the caller's permissions, and every caller sets
      # permissions: {} — so this reads the compare API instead of checking the repo out. Even a
      # token with no declared scope can read a public repo's API.
      - name: Did this push touch README.md or docs/**?
        id: docs
        env:
          TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=false
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changed=true # first push on the branch: no prior ref to compare against
          else
            resp="$RUNNER_TEMP/notify-umbrella-compare.json"
            code="$(curl -sS -o "$resp" -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/compare/$BEFORE...$SHA")"
            if [ "$code" != 200 ]; then
              changed=true # before unknown to the API (e.g. a force-push): take the conservative path
            elif [ "$(jq '(.files // []) | length' "$resp")" -ge 300 ]; then
              changed=true # the compare API caps its file list at 300: the list may be truncated
            elif jq -e '(.files // []) | any(.[]; .filename == "README.md" or (.filename | startswith("docs/")))' "$resp" >/dev/null; then
              changed=true
            fi
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

      - name: repository_dispatch -> ${{ inputs.umbrella }}
        env:
          TOKEN: ${{ secrets.token }}
          UMBRELLA: ${{ inputs.umbrella }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DOCS_CHANGED: ${{ steps.docs.outputs.changed }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::notice::no umbrella-dispatch token set in $REPO — skipping; the umbrella's daily cron still picks this up"
            exit 0
          fi
          events=(submodule-updated)
          if [ "$DOCS_CHANGED" = true ]; then
            events+=(submodule-docs-updated)
          fi
          for event in "${events[@]}"; do
            body="$(jq -nc --arg repo "$REPO" --arg sha "$SHA" --arg event "$event" \
              '{event_type: $event, client_payload: {repo: $repo, sha: $sha}}')"
            code="$(curl -sS -o "$RUNNER_TEMP/notify-umbrella-response.txt" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$UMBRELLA/dispatches" -d "$body")"
            if [ "$code" != 204 ]; then
              echo "::warning::dispatch of $event to $UMBRELLA answered HTTP $code: $(head -c 300 "$RUNNER_TEMP/notify-umbrella-response.txt")"
            else
              echo "dispatched $event for $REPO@$SHA to $UMBRELLA"
            fi
          done
