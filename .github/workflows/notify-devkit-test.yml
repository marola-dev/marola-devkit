# The live test of #158: a run of this must start a bump-merge run with event repository_dispatch.
# It calls the released workflow by its tagged path, so the devkit is a `bump-ready` sender in the umbrella's wiring (#161).
name: notify-devkit test

on: workflow_dispatch

permissions: {}

jobs:
  notify:
    uses: marola-dev/marola-devkit/.github/workflows/notify-devkit.yml@v0.20.2
    secrets:
      pr_bot_key: ${{ secrets.PR_BOT_KEY }}
