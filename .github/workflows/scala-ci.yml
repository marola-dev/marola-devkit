# scala-ci — reusable workflow: JDK setup, sbt format/scalafix check, compile, test, with the
# same sbt/coursier and zinc caches the monorepo's ci.yml build-test job used. MIP-0070 §5.6/task 8.
#
# Out of scope on purpose: build-test's main-only coverage/site-data/gh-workflow-run steps were
# marola-app-specific extras layered on top of the JVM build, not part of "the gate every Scala
# repo needs" — a caller that wants them adds its own job after calling this one.
name: scala-ci

on:
  workflow_call:
    inputs:
      java-version:
        description: "JDK distribution version. Kyo's jars need 25+ (AGENTS.md) — do not lower this without checking that rule."
        type: string
        default: "25"
      sbt-tasks:
        description: "sbt command line to run in one session (so the JVM/zinc warm-up is paid once)."
        type: string
        default: 'scalafmtCheckAll "scalafixAll --check" compile test'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # Dependencies: keyed on the build definition only, so source edits keep the hit.
      - name: Cache sbt / coursier
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Compiled classes + zinc's incremental-compile analysis.
      - name: Cache compiled classes (zinc incremental)
        uses: actions/cache@v6
        with:
          path: |
            core/target
            local/target
            cli/target
            project/target
            project/project/target
          key: ${{ runner.os }}-target-jdk${{ inputs.java-version }}-${{ hashFiles('**/build.sbt', 'project/**') }}-${{ hashFiles('**/*.scala', '**/src/**/resources/**') }}
          restore-keys: |
            ${{ runner.os }}-target-jdk${{ inputs.java-version }}-${{ hashFiles('**/build.sbt', 'project/**') }}-
            ${{ runner.os }}-target-jdk${{ inputs.java-version }}-

      - uses: sbt/setup-sbt@v1

      - name: Format check, scalafix, compile, test
        env:
          SBT_TASKS: ${{ inputs.sbt-tasks }}
        # SC2086: unquoted on purpose — sbt-tasks is a space-separated command line, not one word.
        run: |
          # shellcheck disable=SC2086
          sbt $SBT_TASKS
