# One pin-bump PR per consumer after a release (scripts/bump-consumers.sh). release.yml calls it
# once the release is published; dispatch it by hand to retry or to bump to an older tag.
# It commits and opens the PRs as the org's GitHub App marola-bot (org variable
# MAROLA_BOT_APP_ID, org secret MAROLA_BOT_PRIVATE_KEY), installed with Contents, Pull requests
# and Workflows write: a PR opened with GITHUB_TOKEN would start no CI in the consumer, and could
# not reach it anyway.
name: bump consumers

on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
    secrets:
      MAROLA_BOT_PRIVATE_KEY: { required: true }
  workflow_dispatch:
    inputs:
      version: { description: "X.Y.Z, an existing tag without the v", required: true }

permissions: {}

concurrency:
  group: bump-consumers
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MAROLA_BOT_APP_ID }}
          private-key: ${{ secrets.MAROLA_BOT_PRIVATE_KEY }}
          owner: marola-dev
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          VERSION: ${{ inputs.version }}
        run: |
          BUMP_GIT_NAME="$BOT" BUMP_GIT_EMAIL="$(gh api "/users/$BOT" -q .id)+$BOT@users.noreply.github.com" \
            scripts/bump-consumers.sh "$VERSION"
