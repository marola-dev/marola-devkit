# One pin-bump PR per consumer after a release (scripts/bump-consumers.sh). release.yml calls it
# once the release is published; dispatch it by hand to retry or to bump to an older tag. prepare
# runs nix with no key; publish holds marola-merge-bot's key and runs only checked-in scripts
# (MIP-0086 §5.6, merge-key-check). The bot's token starts CI in each consumer, which a
# GITHUB_TOKEN-opened PR would not.
name: bump consumers

on:
  workflow_call:
    inputs:
      version: { type: string, required: true }
    secrets:
      MERGE_BOT_KEY: { required: true }
  workflow_dispatch:
    inputs:
      version: { description: "X.Y.Z, an existing tag without the v", required: true }

permissions: {}

concurrency:
  group: bump-consumers
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - env:
          VERSION: ${{ inputs.version }}
        run: scripts/bump-consumers.sh prepare "$VERSION" "$RUNNER_TEMP/bump"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: devkit-bump
          path: ${{ runner.temp }}/bump/
          retention-days: 1

  publish:
    needs: prepare
    # One consumer failing in prepare must not stop the others' PRs; the run stays red.
    if: ${{ !cancelled() && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: devkit-bump
          path: ${{ runner.temp }}/bump
      - id: repos
        run: echo "list=$(scripts/bump-consumers.sh names)" >>"$GITHUB_OUTPUT"
      - id: bot
        uses: ./.github/actions/bot-token
        with:
          app-id: ${{ vars.MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.MERGE_BOT_KEY }}
          repositories: ${{ steps.repos.outputs.list }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: scripts/bump-consumers.sh publish "$VERSION" "$RUNNER_TEMP/bump"
