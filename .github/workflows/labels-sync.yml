# labels-sync — reconcile the caller repo's labels against a manifest, so `agent-ready` and the
# rest of the taxonomy mean the same thing everywhere (MIP-0070 §5.7). No --manifest override:
# issues.sh resolves its own default from cwd ($GITHUB_WORKSPACE, the caller's checkout) — the
# caller's own .github/labels.yml when it has one, else this devkit's bundled copy — the same rule
# `just labels-sync` gets locally, so CI and a human's own run can never prune against different
# manifests. No `.git` stripping either: issues.sh's `gh repo view` already resolves from cwd.
#
# The devkit checkout below uses the default GITHUB_TOKEN, with no token input of its own — that
# only works because marola-devkit is a public repo (MIP-0070 makes it public). A private devkit
# would need a cross-repo PAT input here, the same shape as notify-umbrella's `token` secret.
name: labels-sync

on:
  workflow_call:
    inputs:
      devkit-ref:
        description: >-
          git ref of marola-devkit, whose scripts/issues.sh runs the sync and whose own
          .github/labels.yml is the fallback manifest when the caller repo has none of its own.
        type: string
        required: true
      devkit-repo:
        description: "owner/repo of marola-devkit."
        type: string
        default: marola-dev/marola-devkit
      prune:
        description: "Delete labels on the repo that are not in the manifest (issues.sh's --prune)."
        type: boolean
        default: false
      force:
        description: >-
          Pass issues.sh's --force. Only needed alongside prune: true, and only when --prune would
          delete more than half the repo's labels — issues.sh refuses that without --force, on the
          theory that a diff that large is more likely the wrong manifest than a real cleanup.
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Public repo — the default GITHUB_TOKEN can read it, no token input needed here (MIP-0070
      # makes the devkit public). See docs/4-reference_workflows.md for the fuller note.
      - name: checkout marola-devkit@${{ inputs.devkit-ref }} (scripts/issues.sh, .github/labels.yml)
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.devkit-repo }}
          ref: ${{ inputs.devkit-ref }}
          path: .devkit-checkout

      - name: labels sync
        env:
          GH_TOKEN: ${{ github.token }}
          PRUNE: ${{ inputs.prune }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(labels sync)
          [ "$PRUNE" = "true" ] && args+=(--prune)
          [ "$FORCE" = "true" ] && args+=(--force)
          bash .devkit-checkout/scripts/issues.sh "${args[@]}"
